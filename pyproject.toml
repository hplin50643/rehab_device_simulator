[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rehab-device-simulator"
version = "0.1.0"
description = "C521M 復健機二進位 TCP 模擬儀表板"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["Flask==3.1.3", "waitress==3.0.2"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "ruff==0.16.5", "build==1.6.0"]

[project.scripts]
rehab-simulator = "rehab_simulator.__main__:main"

[tool.setuptools.packages.find]
include = ["rehab_simulator*"]

[tool.setuptools.package-data]
rehab_simulator = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
